name: Security Scan

on:
  push:
    branches: [ "main" ]

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Nmap
      run: sudo apt-get update && sudo apt-get install -y nmap

    - name: Run Python script
      run: python3 scanner.py 127.0.0.1
